[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-agent"
version = "0.1.0"
description = "LangGraph-based AI search agent MVP for a retail/e-commerce catalog"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
