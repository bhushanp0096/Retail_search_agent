name: CI

# Runs on every push/PR to main, plus a manual "Run workflow" button
# (workflow_dispatch) for on-demand runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Install & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite (fully offline — no API key needed)
        run: pytest -v

      - name: Smoke-test the CLI (graceful degradation — no API key needed)
        run: |
          python main.py "waterproof jacket for an October coastal wedding" --customer-id CUST-001 --show-skus

      - name: Best-effort smoke-test with a real API key
        # Only runs meaningfully if the GROQ_API_KEY secret is set on
        # the repo (see README). Never fails the job on its own — an LLM
        # call flaking shouldn't block CI — but the output is worth reading.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        continue-on-error: true
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "No GROQ_API_KEY secret configured — skipping the real-LLM smoke test."
          else
            python main.py "waterproof jacket for an October coastal wedding" --customer-id CUST-001
          fi

  docker:
    name: Build, smoke-test, and (on main) publish the image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally for the smoke test below)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: search-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the built image and verify /health
        # Only exercises the FastAPI container's health endpoint — doesn't
        # need GROQ_API_KEY, since /health never touches the graph.
        run: |
          docker run -d --name ci-test -p 8000:8000 search-agent:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for container to be ready... (attempt $i)"
            sleep 2
          done
          curl -sf http://localhost:8000/health || (echo "Health check failed"; docker logs ci-test; exit 1)
          docker stop ci-test

      - name: Compute lowercase image name
        if: github.event_name == 'push'
        id: image
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR (main only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
